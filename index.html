<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solmate AI | Travel Concierge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans h-screen flex overflow-hidden">

    <aside class="w-64 bg-emerald-900 text-white flex-shrink-0 hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold mb-8 tracking-tight">Solmate <span class="font-light">AI</span></h1>
        <button class="w-full py-3 px-4 bg-emerald-800 hover:bg-emerald-700 rounded-lg text-left text-sm mb-6 transition-all border border-emerald-700/50">
            <i class="fas fa-plus mr-2"></i> New Trip Plan
        </button>
        <div class="flex-1 overflow-y-auto space-y-2">
            <p class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold mb-2">Recent Plans</p>
            <div class="p-2 hover:bg-emerald-800 rounded cursor-pointer text-sm truncate">Tokyo Food Tour</div>
            <div class="p-2 hover:bg-emerald-800 rounded cursor-pointer text-sm truncate">Italy Budget 7-Days</div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative">
        <header class="h-16 bg-white border-b flex items-center justify-between px-8">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-sm font-medium text-slate-600">Gemma-2.0-Flash Active</span>
            </div>
            <a href="#" class="text-emerald-700 font-semibold hover:underline text-sm">Exit Chat</a>
        </header>

        <div id="chat-window" class="chat-container flex-1 overflow-y-auto p-4 md:p-12 space-y-8">
            <div class="flex gap-4 max-w-3xl">
                <div class="w-8 h-8 rounded bg-emerald-900 flex items-center justify-center text-white text-xs shrink-0">AI</div>
                <div class="bg-white border p-4 rounded-2xl rounded-tl-none shadow-sm text-slate-800 leading-relaxed">
                    Hello! I'm your travel expert. Where would you like to explore today?
                </div>
            </div>
        </div>

        <div class="p-4 md:p-8 bg-gradient-to-t from-slate-50 via-slate-50 to-transparent">
            <div class="max-w-3xl mx-auto relative">
                <div id="loading" class="hidden absolute -top-8 left-0 text-xs text-slate-400 italic">AI is crafting your itinerary...</div>
                <div class="flex items-center gap-2 bg-white border shadow-xl rounded-2xl p-2 pr-4 focus-within:border-emerald-500 transition-all">
                    <input type="text" id="userInput" placeholder="e.g. 'Build a 5-day itinerary for Seoul'" 
                           class="flex-1 p-3 outline-none text-slate-700 bg-transparent">
                    <button onclick="handleSend()" class="bg-emerald-900 text-white w-10 h-10 rounded-xl hover:bg-emerald-800 transition-colors">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <p class="text-center text-[10px] text-slate-400 mt-3">Solmate AI can make mistakes. Verify travel requirements locally.</p>
            </div>
        </div>
    </main>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('userInput');
        const loader = document.getElementById('loading');

        function appendMessage(text, isUser = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 ${isUser ? 'flex-row-reverse self-end' : 'max-w-3xl'}`;
            
            const avatar = isUser ? 
                `<div class="w-8 h-8 rounded bg-slate-300 flex items-center justify-center text-slate-600 text-xs shrink-0"><i class="fas fa-user"></i></div>` :
                `<div class="w-8 h-8 rounded bg-emerald-900 flex items-center justify-center text-white text-xs shrink-0">AI</div>`;

            const bubbleClass = isUser ? 
                `bg-emerald-900 text-white rounded-tr-none` : 
                `bg-white border text-slate-800 rounded-tl-none`;

            wrapper.innerHTML = `
                ${avatar}
                <div class="${bubbleClass} p-4 rounded-2xl shadow-sm leading-relaxed whitespace-pre-line">
                    ${text}
                </div>
            `;
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function handleSend() {
            const query = userInput.value.trim();
            if (!query) return;

            appendMessage(query, true);
            userInput.value = '';
            loader.classList.remove('hidden');

            try {
                const res = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: query }) // Matches backend Pydantic key
                });

                const data = await res.json();
                if (data.response) {
                    appendMessage(data.response);
                } else {
                    appendMessage("I received an empty response. Please try again.");
                }
            } catch (err) {
                appendMessage("Connection error: Make sure your FastAPI server is running on port 8000.");
            } finally {
                loader.classList.add('hidden');
            }
        }

        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
